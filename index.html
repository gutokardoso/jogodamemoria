
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jogo da Memória Premium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen" class="screen">
  <img class="bg" src="assets/start-bg.jpg">

  <div class="title-wrap">
    <h1>JOGO DA MEMÓRIA</h1>
  </div>

  <div class="center-card">
    <img src="assets/card-back.png">
  </div>

  <button id="startBtn" class="start-button">
    <img src="assets/button-start.png">
    <span>COMEÇAR DESAFIO</span>
  </button>
</div>

<div id="gameScreen" class="hidden">
  <div class="hud">
    <div class="hud-box">TEMPO<br><span id="time">45s</span></div>
    <div class="hud-box">PONTUAÇÃO<br><span id="score">0000</span></div>
    <div class="hud-box">PARES<br><span id="pairs">0/8</span></div>
  </div>

  <div id="grid" class="grid"></div>
</div>

<script src="script.js"></script>
</body>
</html>
