<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Memória Premium</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />

</head>
<body>
<img src="./assets/start-bg-clean.jpg" class="start-bg" alt="">
  <main id="app">
    <section id="startScreen" class="screen start-screen active" aria-label="Tela inicial">
      <button id="startButton" class="start-button" aria-label="Começar desafio">
        <img src="assets/start-button-separated.png" alt="" aria-hidden="true" />
      </button>
    </section>

    <section id="gameScreen" class="screen game-screen" aria-label="Tela do jogo">
      <header class="hud">
        <div class="panel timer-panel">
          <div class="timer-ring" aria-label="Cronômetro">
            <svg class="timer-svg" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="timer-track" cx="60" cy="60" r="52"></circle>
              <circle id="timerProgress" class="timer-progress" cx="60" cy="60" r="52"></circle>
            </svg>
            <strong id="timer">45s</strong>
          </div>
        </div>

        

        <div class="right-panels">
          
          <div class="panel pairs-panel"><div><span>ACERTOS</span><strong id="pairs">0/8</strong></div></div>
          <button id="homeButton" class="home-button" aria-label="Voltar para tela inicial"><img src="assets/home-icon.png" alt="Home"></button>
        </div>
      </header>

      <div class="game-logo-wrapper game-logo-in-game" aria-hidden="true">
        <img src="./assets/logo-memoria.png" class="game-logo" alt="">
      </div>


      <div id="countdown" class="countdown show">3</div>
      <section id="board" class="board" aria-label="Cartas do jogo"></section>
    </section>


    <section id="resultScreen" class="screen result-screen" aria-label="Resultado">
      <div class="victory-scene">
        <h1 id="resultTitle" class="victory-title">PARABÉNS!</h1>
        <img id="resultTextImage" class="victory-result-image" src="assets/parabens.png" alt="Parabéns! Você venceu!">
        <p id="resultText" class="victory-subtitle victory-text-hidden">VOCÊ VENCEU!</p>
<div class="victory-stats">
          <img src="assets/result-panel-clean.png" class="victory-panel-img" alt="" aria-hidden="true">
          <div class="victory-stat victory-time">
            <span>TEMPO RESTANTE</span>
            <strong id="finalTime">0</strong>
          </div>
          <div class="victory-stat victory-score">
            <span>PONTUAÇÃO FINAL</span>
            <strong id="finalScore">0000</strong>
          </div>
        </div>

        <div class="victory-actions">
          <button id="playAgain" class="victory-button victory-restart" aria-label="Jogar novamente">
            <img src="assets/result-btn-restart.png" alt="Jogar novamente">
          </button>
          <button id="menuButton" class="victory-button victory-menu" aria-label="Menu inicial">
            <img src="assets/result-btn-menu.png" alt="Menu inicial">
          </button>
        </div>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
